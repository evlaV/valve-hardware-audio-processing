# Steam Deck Specific audio card settings
# acp5x - LCD deck
# acp6x - OLED deck (old driver)
# sof-nau8821-max - OLED deck (current driver)
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_input.*"
        alsa.card_name = "acp5x"
      }
      {
        node.name = "~alsa_input.*"
        alsa.card_name = "acp6x"
      }
      {
        node.name = "~alsa_input.*"
        alsa.card_name = "sof-nau8821-max"
      }
      {
        node.name = "~alsa_output.*"
        alsa.card_name = "acp5x"
      }
      {
        node.name = "~alsa_output.*"
        alsa.card_name = "acp6x"
      }
      {
        node.name = "~alsa_output.*"
        alsa.card_name = "sof-nau8821-max"
      }
    ]
    actions = {
      update-props = {
        api.alsa.headroom      = 1024
      }
    }
  }

  {
    matches = [
      {
        device.name = "~alsa_card.*"
        device.nick = "acp5x"
      }
      {
        device.name = "~alsa_card.*"
        device.nick = "acp6x"
      }
      {
        device.name = "~alsa_card.*"
        device.nick = "sof-nau8821-max"
      }
    ]
    actions = {
      update-props = {
        api.acp.disable-pro-audio = true
        session.dont-restore-off-profile = true
      }
    }
  }
]

node.filter-graph.rules = [
  {
    matches = [
      {
        media.class = "Audio/Sink"
        alsa.card_name = "sof-nau8821-max"
        device.profile.description = "Speaker"
      }
    ]
    actions = {
      create-filter-graph = [
        {
          nodes = [
            {
              type = lv2,
              name = valve_deck_speakers,
              plugin = "https://faustlv2.bitbucket.io/valve_deck_speakers",
              label = valve_deck_speakers
            }
          ]
        }
      ]
    }
  }
]
