# Steam Machine Specific audio card settings

context.properties = {
  # Needed for external volume control
  support.varlink = true
}

monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.pci-.*"
        device.nick = "HDA ATI HDMI"
      }
    ]
    actions = {
      update-props = {
        device.description = "HDMI / DisplayPort"
        api.acp.disable-pro-audio = true
        # Output full range on HDMI and let the rendering device manage volume
        device.routes.default-sink-volume = 1.0
        # Use CEC for volume control if enabled
        api.alsa.external-volume-control = "unix:/run/user/1000/cec-audio-control/org.pipewire.ExternalVolume"
        steamos.supports-hdmi-cec = true
      }
    }
  },
  {
    matches = [
      {
        node.name = "~alsa_output.pci-.*hdmi.*"
      }
    ]
    actions = {
      update-props = {
        # Extend the suspend timeout to 1 hour to avoid amplifier startup
        # delays on some soundbars and receivers
        session.suspend-timeout-seconds = 3600
      }
    }
  }
]

# Enable CEC audio control by default
wireplumber.settings {
  monitor.alsa.enable-external-volume-control = true
}
